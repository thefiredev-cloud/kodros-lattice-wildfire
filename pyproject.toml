[project]
name = "lattice-wildfire"
version = "0.1.0"
description = "Wildfire applications on Anduril's Lattice SDK: feeds, perception, planning, AI analyst, chat."
requires-python = ">=3.12"
dependencies = [
    "anduril-lattice-sdk==5.4.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
talk = ["mcp>=2.3,<3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
lw-harness = "lattice_wildfire.harness.__main__:main"
lw-feeds = "lattice_wildfire.feeds.__main__:main"
lw-fusion = "lattice_wildfire.fusion.__main__:main"
lw-planner = "lattice_wildfire.planner.__main__:main"
lw-analyst = "lattice_wildfire.analyst.__main__:main"
lw-talk = "lattice_wildfire.talk.__main__:main"
lw-talk-mcp = "lattice_wildfire.talk.mcp_server:main"
lw-map = "lattice_wildfire.map.__main__:main"
lw-run = "lattice_wildfire.run.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lattice_wildfire"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["src/lattice_wildfire/map/static"]

[tool.ruff.lint]
select = ["F", "E9", "B", "I", "UP"]
# B023: lambdas called inside the same loop iteration (glossary substitution) are safe.
# B905: offset pairwise zips over closed rings are intentionally unequal length.
# UP046/UP047: keep explicit TypeVar generics readable for 3.12 tooling.
ignore = ["B023", "B905", "UP046", "UP047"]
